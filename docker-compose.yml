services:
  postgres:
    image: postgres:16-alpine
    container_name: kompyle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kompyle
      POSTGRES_USER: kompyle
      POSTGRES_PASSWORD: kompyle_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
