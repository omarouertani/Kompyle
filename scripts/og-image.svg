<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#FAF9F5"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="10" fill="#C2683F"/>

  <!-- Subtle canvas grid hint (decorative) -->
  <g opacity="0.06" stroke="#3F3A2E" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" letter-spacing="-0.03em" fill="#3F3A2E">Kompyle</text>

  <!-- Terracotta underline accent -->
  <rect x="560" y="330" width="160" height="6" rx="3" fill="#C2683F"/>

  <!-- Tagline -->
  <text x="640" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#6B6557">AI Resume Editor &amp; ATS Auditor</text>

  <!-- Feature line -->
  <text x="640" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0.15em" fill="#9A9284">OPEN SOURCE  ·  PRIVACY-FIRST  ·  CANVA-STYLE CANVAS  ·  MIT</text>
</svg>
