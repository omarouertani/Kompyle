# Isolated Kompyle stack for screenshots and the demo video.
# Own database volume: only fictional data (Jane Doe), never your real profiles.
#   docker compose -f demo-video/docker-compose.demo.yml up -d
# App on http://localhost:3100. Uses the kompyle:latest image built by the main compose file.
name: kompyle-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kompyle
      POSTGRES_USER: kompyle
      POSTGRES_PASSWORD: kompyle_demo
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompyle -d kompyle"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: kompyle:latest
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://kompyle:kompyle_demo@db:5432/kompyle
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KOMPYLE_UPDATE_CHECK: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  demo_pgdata:
