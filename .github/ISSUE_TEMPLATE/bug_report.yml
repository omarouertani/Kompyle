name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use fictional data only (never paste a real CV, address or API key).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kompyle version
      placeholder: e.g. 0.2.3
  - type: dropdown
    id: setup
    attributes:
      label: How do you run Kompyle?
      options: [Docker Compose, npm run dev, Other]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
